[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "accs-trace"
version = "0.1.0"
description = "Local-first Issue-Commit link recovery and review tool"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
]
[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"

[tool.coverage.run]
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
